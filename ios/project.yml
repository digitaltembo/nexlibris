# The Xcode project, generated by XcodeGen: after changing this, run `xcodegen` in ios/ (brew install xcodegen)
# and commit the regenerated nexlibris.xcodeproj.
name: nexlibris
options:
  bundleIdPrefix: org.nexlibris
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
packages:
  NexlibrisKit:
    path: NexlibrisKit
targets:
  nexlibris:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: NexlibrisKit
    settings:
      base:
        PRODUCT_NAME: nexlibris
        PRODUCT_BUNDLE_IDENTIFIER: org.nexlibris.app
        INFOPLIST_FILE: App/Info.plist
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        # The copy reads client/dist, outside the project.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    postCompileScripts:
      - name: Copy the web app
        script: '"$SRCROOT/scripts/copy-web-app.sh"'
        basedOnDependencyAnalysis: false
schemes:
  nexlibris:
    build:
      targets:
        nexlibris: all
    run:
      config: Debug
    archive:
      config: Release
